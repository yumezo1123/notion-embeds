name: Expire old embeds (3 days)

on:
  schedule:
    - cron: "0 18 * * *" # 03:00 JST daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete directories older than 3 days
        run: |
          set -e
          today=$(date -u +%s)
          removed=0
          for dir in */; do
            dir="${dir%/}"
            [ "$dir" = ".github" ] && continue
            datepart=$(echo "$dir" | grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}' || true)
            [ -z "$datepart" ] && continue
            created=$(date -u -d "$datepart" +%s 2>/dev/null) || continue
            age_days=$(( (today - created) / 86400 ))
            if [ "$age_days" -ge 3 ]; then
              echo "Removing $dir (age: ${age_days}d)"
              git rm -r --ignore-unmatch "$dir"
              removed=1
            fi
          done
          if [ "$removed" -eq 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Auto-expire embeds older than 3 days"
            git push
          else
            echo "Nothing to expire"
          fi
